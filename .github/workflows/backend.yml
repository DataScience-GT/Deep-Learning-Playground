name: Backend Checks

on:
  push:
    branches:
      - main
      - nextjs
      - prod-deploy
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      #----------------------------------------------
      #       check-out repo and set-up mamba env
      #----------------------------------------------
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Mamba
        uses: conda-incubator/setup-miniconda@v2
        with:
          miniforge-version: latest
          use-mamba: true
          activate-environment: dlp

      # One cache, keyed on both dependency files, no restore-keys: a hit is exactly the env these files built.
      - name: Cache dlp env
        id: cached-env
        uses: actions/cache@v3
        with:
          path: /usr/share/miniconda3/envs/dlp
          key: dlp-env-${{ runner.os }}-1-${{ hashFiles('training/environment.yml', 'training/poetry.lock') }}

      - name: Update environment
        if: steps.cached-env.outputs.cache-hit != 'true'
        run: mamba env update -n dlp -f training/environment.yml

      - name: Install dependencies
        run: cd training && poetry install --no-interaction --no-root
        shell: bash -el {0}

      - name: Add Poetry env to PATH
        run: cd training && echo "$(poetry env info --path)/bin" >> $GITHUB_PATH
        shell: bash -el {0}
      #----------------------------------------------
      #       pyright static checker
      #----------------------------------------------
      - name: Run Pyright Static Checker
        id: pyright-static-checker
        uses: jordemort/action-pyright@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }} # You need this
          reporter: github-pr-review # Change reporter.

      #----------------------------------------------
      #       black formatter
      #----------------------------------------------
      - uses: rickstaa/action-black@v1
        id: action_black
        with:
          black_args: "."

      - uses: stefanzweifel/git-auto-commit-action@v4
        if: steps.action_black.outputs.is_formatted == 'true'
        with:
          commit_message: ":art: Format Python code with psf/black"
          commit_options: "--no-verify"
          commit_user_name: github-actions
          commit_user_email: ghaction@github.com

  test:
    needs: lint
    runs-on: ubuntu-22.04
    steps:
      #----------------------------------------------
      #       check-out repo and set-up mamba env
      #----------------------------------------------
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Mamba
        uses: conda-incubator/setup-miniconda@v2
        with:
          miniforge-version: latest
          use-mamba: true
          activate-environment: dlp

      # One cache, keyed on both dependency files, no restore-keys: a hit is exactly the env these files built.
      - name: Cache dlp env
        id: cached-env
        uses: actions/cache@v3
        with:
          path: /usr/share/miniconda3/envs/dlp
          key: dlp-env-${{ runner.os }}-1-${{ hashFiles('training/environment.yml', 'training/poetry.lock') }}

      - name: Update environment
        if: steps.cached-env.outputs.cache-hit != 'true'
        run: mamba env update -n dlp -f training/environment.yml

      - name: Install dependencies
        run: cd training && poetry install --no-interaction --no-root
        shell: bash -el {0}

      - name: Add Poetry env to PATH
        run: cd training && echo "$(poetry env info --path)/bin" >> $GITHUB_PATH
        shell: bash -el {0}
      #----------------------------------------------
      #       run test suite
      #----------------------------------------------
      - name: Run tests with moto
        run: |
          export AWS_ACCESS_KEY_ID=testing
          export AWS_SECRET_ACCESS_KEY=testing
          export AWS_DEFAULT_REGION=us-west-2
          cd training && poetry run pytest tests
        shell: bash -el {0}
