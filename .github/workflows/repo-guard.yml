name: Repo Guard

# Blocks PRs that add an installed environment or other bulk files (see #20).
on:
  pull_request:

permissions:
  contents: read
  pull-requests: write # to comment on the PR when the guard fails

jobs:
  added-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check files added by this PR
        env:
          BASE: origin/${{ github.base_ref }}
          MAX_FILES: 300
          MAX_BYTES: 5000000
        run: |
          git diff --name-only --diff-filter=A "$BASE"...HEAD > added.txt
          n=$(wc -l < added.txt)
          echo "Files added: $n"
          if [ "$n" -gt "$MAX_FILES" ]; then
            echo "This PR adds $n files (limit $MAX_FILES). Is an environment, build output or dataset committed by mistake?" > guard.txt
          fi
          big=$(tr '\n' '\0' < added.txt | xargs -0 -r stat -c '%s %n' | awk -v max="$MAX_BYTES" '$1 > max')
          if [ -n "$big" ]; then
            { echo "Files over $MAX_BYTES bytes:"; echo '```'; echo "$big"; echo '```'; } >> guard.txt
          fi
          if [ -s guard.txt ]; then
            echo "::error::$(head -1 guard.txt)"
            cat guard.txt
            exit 1
          fi

      - name: Comment on the PR
        if: failure() && hashFiles('guard.txt') != ''
        continue-on-error: true # fork PRs get a read-only token
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          { echo "**Repo Guard failed**"; echo; cat guard.txt; echo; echo "Remove those files from the PR, then push again. See #20 for why this check exists."; } > comment.md
          gh pr comment "$PR" --body-file comment.md --edit-last --create-if-none || gh pr comment "$PR" --body-file comment.md
