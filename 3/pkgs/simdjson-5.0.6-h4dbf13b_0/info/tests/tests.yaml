- script:
    content:
    - cmake -G Ninja -S test/ -B build/ -D TEST_TARGET=simdjson ${CMAKE_ARGS}
    - cmake --build build/
    - cmake --build build --target test
    cwd: etc/conda/test-files/simdjson/0
  requirements:
    run:
    - gxx_linux-64 15.*
    - cmake
    - ninja
  files:
    recipe:
    - test/*
