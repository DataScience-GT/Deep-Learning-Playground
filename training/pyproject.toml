[project]
name = "training"
version = "0.1.0"
description = ""
authors = [{ name = "Daniel Wu", email = "dwu359@gatech.edu" }]
readme = "README.md"
requires-python = ">=3.9,<3.10"
dependencies = [
    "boto3>=1.28.15,<2",
    "django>=4.2.10,<5",
    "django-ninja>=0.22.2,<0.23",
    "scikit-learn>=1.3.0,<2",
    "pandas>=2.0.3,<3",
    "firebase-admin>=6.2.0,<7",
    "pre-commit>=3.3.3,<4",
    "click>=8.1.7,<9",
    "requests>=2.31.0,<3",
    "django-cors-headers>=4.2.0,<5",
    "gunicorn>=21.2.0,<22",
    "pytest>=7.4.0,<8",
    "celery[redis,sqs]>=5.3.6,<6",
    # Previously installed by conda via environment.yml (pytorch=2.5.1, torchvision=0.20.1).
    "torch==2.5.1",
    "torchvision==0.20.1",
    # Older typing-extensions breaks `import torch` (TypeIs); see commit e5d918fd.
    "typing-extensions>=4.12.2",
]

[dependency-groups]
dev = [
    "ggshield>=1.18.0,<2",
    "moto>=4.1.14,<5",
    "pytest-django>=4.5.2,<5",
]

[tool.uv]
# Dependency management only: never build/install the `training` project itself
# (replaces `poetry install --no-root`).
package = false

# PyTorch: CPU-only wheels on Linux (Docker, CI, ECS) instead of PyPI's default
# Linux build, which pulls in ~2 GB of NVIDIA CUDA libraries. macOS uses PyPI.
# For GPU workers, swap the URL for a CUDA index (e.g. .../whl/cu124).
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true # only packages pinned to this index in [tool.uv.sources] use it

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.pyright]
venvPath = "."
venv = ".venv"
